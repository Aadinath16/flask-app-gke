apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-app
  namespace: flask-poc


spec:
  replicas: 1


  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0


  selector:
    matchLabels:
      app: flask-app


  template:

    metadata:
      labels:
        app: flask-app


    spec:

      # Workload Identity KSA
      serviceAccountName: flask-ksa


      containers:

      # ================================
      # Flask Application
      # ================================
      - name: flask-app

        image: us-docker.pkg.dev/gcp-test-1618-dev/flask-app-repo/flask-app:1.0.0-dev-7-f42c0e9

        imagePullPolicy: Always


        ports:
        - containerPort: 8080


        # Load env from ConfigMap + Secret
        envFrom:

        - configMapRef:
            name: flask-config

        - secretRef:
            name: flask-secret


        # Volume Mount
        volumeMounts:
        - name: app-volume
          mountPath: /data


        # Health Checks
        readinessProbe:
          httpGet:
            path: /api/metrics/200
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10


        livenessProbe:
          httpGet:
            path: /api/metrics/200
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20


        # resources:
        #   requests:
        #     cpu: "100m"
        #     memory: "256Mi"
        #   limits:
        #     cpu: "250m"
        #     memory: "300Mi"


      # ================================
      # Cloud SQL Auth Proxy (Sidecar)
      # ================================
      - name: cloud-sql-proxy

        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.21.0
        args:
          - "--structured-logs"
          - "--port=3306"
          - "gcp-test-1618-dev:us-central1:gcp-test-1618-sql-dev"


        securityContext:
          runAsNonRoot: true


        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"


      # ================================
      # Volumes
      # ================================
      volumes:

      - name: app-volume
        persistentVolumeClaim:
          claimName: flask-pvc
